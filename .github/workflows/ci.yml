# Actions are pinned to majors that run on the Node 24 runtime: Node 20 is
# deprecated on GitHub-hosted runners. These majors need Actions runner
# v2.327.1 or newer, which GitHub-hosted runners satisfy; a self-hosted runner
# older than that would need updating.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # The race detector matters here: the engine runs several timers and an
      # HTTP server against shared state.
      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

  integration:
    name: Integration (real Gluetun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Verifies the control-server contract against Gluetun itself. A fake can
      # only confirm that the code matches our understanding of the API; this
      # confirms the understanding.
      - name: Run integration tests
        run: make integration

      - name: Gluetun container logs on failure
        if: failure()
        run: docker logs gluetun-itest || true

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Build only: publishing happens in the release workflow, on tags.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
