# Tag-driven release.
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# publishes ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1 and :latest, and creates a
# GitHub Release with generated notes. Pre-release tags (v1.2.3-rc.1) are
# published but deliberately do not move :latest.
#
# Actions are pinned to majors that run on the Node 24 runtime: Node 20 is
# deprecated on GitHub-hosted runners. These majors need Actions runner
# v2.327.1 or newer, which GitHub-hosted runners satisfy; a self-hosted runner
# older than that would need updating.
name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be re-run from the Actions tab if publishing failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag must never publish an image that does not build or pass its tests.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Strip the leading v for the image tags and the binary version string.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # The image name has to be lowercase; the repository name may not be.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
          # metadata-action only applies latest to non-prerelease semver tags.
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=gluetun-proton-list-updater
            org.opencontainers.image.description=Keeps Gluetun on the least utilised ProtonVPN server
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Lets consumers verify the image really came from this repository and
      # commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history so the generated notes can diff against the previous tag.
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # A tag such as v1.2.3-rc.1 is a pre-release.
          if [ "${tag}" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release body
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > release-notes.md <<EOF
          ## Container image

          \`\`\`
          ${image}:${{ steps.version.outputs.version }}
          \`\`\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          \`\`\`yaml
          services:
            proton-updater:
              image: ${image}:${{ steps.version.outputs.version }}
          \`\`\`

          Digest: \`${{ needs.publish.outputs.digest }}\`
          EOF

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          # Appends the commit list since the previous tag to the body above.
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
